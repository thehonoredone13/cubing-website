<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Volunteer Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12172B;
    --paper:#F6F4EF;
    --paper-dim:#EAE7DD;
    --cube-red:#E6402A;
    --cube-green:#1E8E5A;
    --line:#D9D5C8;
    --text-dim:#6B7280;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;padding:30px 20px;}
  .wrap{max-width:1100px;margin:0 auto;}
  header{margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:26px;}
  .back-link{color:var(--text-dim);text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .back-link:hover{color:var(--ink);}

  /* Filter & Controls Bar */
  .filter-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    align-items: end;
  }
  .filter-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .filter-group label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .filter-control {
    width: 100%;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    color: var(--ink);
    outline: none;
    transition: border-color .15s;
  }
  .filter-control:focus { border-color: var(--ink); }

  .actions-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;color:var(--text-dim);padding:10px;border-bottom:1px solid var(--line);background:var(--paper-dim);text-align:left;}
  td{padding:12px 10px;border-bottom:1px solid var(--line);}
  
  .badge{display:inline-block;padding:3px 8px;border-radius:999px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;}
  .badge-role{background:rgba(30,142,90,0.15);color:var(--cube-green);}
  .badge-event{background:rgba(18,23,43,0.08);color:var(--ink);border:1px solid var(--line);margin:2px 2px 2px 0;}
  
  .phone-link {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--ink);
    text-decoration: none;
    font-weight: 500;
  }
  .phone-link:hover { text-decoration: underline; color: var(--cube-green); }

  .btn{
    padding:6px 12px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;transition:opacity .15s ease;
  }
  .btn:hover{opacity:0.85;}
  .btn-refresh{background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;}

  .stats-counter {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--text-dim);
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Volunteer Registrations</h1>
    </div>
    <a href="admin_home.html" class="back-link">&larr; Back to Home</a>
  </header>

  <!-- Filters & Search -->
  <div class="filter-card">
    <div class="filter-group">
      <label for="roleFilter">Filter by Role</label>
      <select id="roleFilter" class="filter-control" onchange="applyFilterAndSort()">
        <option value="ALL">All Roles</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="scrambleFilter">Scrambler Specialty</label>
      <select id="scrambleFilter" class="filter-control" onchange="applyFilterAndSort()">
        <option value="ALL">All Events / Specialties</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="sortBy">Sort Priority</label>
      <select id="sortBy" class="filter-control" onchange="applyFilterAndSort()">
        <option value="Role-then-Specialty">Role, then Specialty</option>
        <option value="Specialty-then-Role">Specialty, then Role</option>
        <option value="Name-asc">Name (A-Z)</option>
        <option value="Grade-asc">Grade Level</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="searchInput">Search Volunteer</label>
      <input type="text" id="searchInput" class="filter-control" placeholder="Search name, phone, grade..." oninput="applyFilterAndSort()">
    </div>
  </div>

  <div class="actions-bar">
    <button class="btn btn-refresh" onclick="loadVolunteers()">↻ Refresh Volunteers</button>
    <div id="volunteerCount" class="stats-counter">Showing 0 volunteers</div>
  </div>
  
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Full Name</th>
          <th>Mobile Number</th>
          <th>Grade Level</th>
          <th>Role</th>
          <th>Scramble Events</th>
        </tr>
      </thead>
      <tbody id="volunteerTableBody">
        <tr>
          <td colspan="5" style="text-align:center; padding: 20px; color: var(--text-dim);">Loading...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const VOLUNTEER_API_URL = "https://script.google.com/macros/s/AKfycbzcYqKBeoI-SlCik2nVTUWZpZAo1VDzKWn495hkntC615xHwuQNv4g8x3B2TbcjGIOj9A/exec";

  let rawVolunteers = [];

  function loadVolunteers() {
    const tbody = document.getElementById("volunteerTableBody");
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 20px; color: var(--text-dim);">Loading...</td></tr>`;

    fetch(VOLUNTEER_API_URL)
      .then(res => res.json())
      .then(data => {
        rawVolunteers = Array.isArray(data) ? data : (data.data || []);
        if (rawVolunteers.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 20px; color: var(--text-dim);">No volunteers found.</td></tr>`;
          document.getElementById('volunteerCount').innerText = "Showing 0 volunteers";
          return;
        }

        populateDropdowns(rawVolunteers);
        applyFilterAndSort();
      })
      .catch(err => {
        console.error("Error loading volunteers:", err);
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--cube-red); padding: 20px;">Failed to load data. Verify VOLUNTEER_API_URL.</td></tr>`;
      });
  }

  function populateDropdowns(data) {
    const roleSelect = document.getElementById('roleFilter');
    const scrambleSelect = document.getElementById('scrambleFilter');
    
    const currentRole = roleSelect.value;
    const currentScramble = scrambleSelect.value;

    const uniqueRoles = new Set();
    const uniqueEvents = new Set();

    data.forEach(item => {
      const roleStr = item.role || item.Role || '';
      if (roleStr) {
        roleStr.split(',').forEach(r => uniqueRoles.add(r.trim()));
      }

      const eventStr = item.scrambleEvents || item.ScrambleEvents || item.events || item.Events || '';
      if (eventStr) {
        eventStr.split(',').forEach(e => {
          const clean = e.trim();
          if (clean && clean !== '—' && clean.toLowerCase() !== 'none' && clean.toLowerCase() !== 'n/a') {
            uniqueEvents.add(clean);
          }
        });
      }
    });

    roleSelect.innerHTML = '<option value="ALL">All Roles</option>';
    uniqueRoles.forEach(r => {
      roleSelect.innerHTML += `<option value="${r}">${r}</option>`;
    });
    if ([...uniqueRoles].includes(currentRole)) roleSelect.value = currentRole;

    scrambleSelect.innerHTML = '<option value="ALL">All Events / Specialties</option>';
    uniqueEvents.forEach(evt => {
      scrambleSelect.innerHTML += `<option value="${evt}">${evt}</option>`;
    });
    if ([...uniqueEvents].includes(currentScramble)) scrambleSelect.value = currentScramble;
  }

  function applyFilterAndSort() {
    const roleFilter = document.getElementById('roleFilter').value;
    const scrambleFilter = document.getElementById('scrambleFilter').value;
    const sortBy = document.getElementById('sortBy').value;
    const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();

    let filtered = rawVolunteers.filter(row => {
      const role = (row.role || row.Role || '').trim();
      const scrambleEvents = (row.scrambleEvents || row.ScrambleEvents || row.events || row.Events || '').trim();
      const name = (row.fullName || row.Name || '').toLowerCase();
      const mobile = String(row.mobileNumber || row.Mobile || row.Phone || '').toLowerCase();
      const grade = String(row.gradeLevel || row.Grade || row.GradeLevel || '').toLowerCase();

      const matchRole = (roleFilter === 'ALL') || role.toLowerCase().includes(roleFilter.toLowerCase());
      const matchScramble = (scrambleFilter === 'ALL') || scrambleEvents.toLowerCase().includes(scrambleFilter.toLowerCase());
      const matchSearch = !searchQuery || name.includes(searchQuery) || mobile.includes(searchQuery) || grade.includes(searchQuery);

      return matchRole && matchScramble && matchSearch;
    });

    filtered.sort((a, b) => {
      const roleA = (a.role || a.Role || '').toLowerCase();
      const roleB = (b.role || b.Role || '').toLowerCase();
      const eventA = (a.scrambleEvents || a.ScrambleEvents || '').toLowerCase();
      const eventB = (b.scrambleEvents || b.ScrambleEvents || '').toLowerCase();
      const nameA = (a.fullName || a.Name || '').toLowerCase();
      const nameB = (b.fullName || b.Name || '').toLowerCase();
      const gradeA = String(a.gradeLevel || a.Grade || '');
      const gradeB = String(b.gradeLevel || b.Grade || '');

      if (sortBy === 'Role-then-Specialty') {
        const roleCompare = roleA.localeCompare(roleB);
        if (roleCompare !== 0) return roleCompare;
        return eventA.localeCompare(eventB);
      }

      if (sortBy === 'Specialty-then-Role') {
        const eventCompare = eventA.localeCompare(eventB);
        if (eventCompare !== 0) return eventCompare;
        return roleA.localeCompare(roleB);
      }

      if (sortBy === 'Name-asc') {
        return nameA.localeCompare(nameB);
      }

      if (sortBy === 'Grade-asc') {
        return gradeA.localeCompare(gradeB, undefined, {numeric: true});
      }

      return 0;
    });

    document.getElementById('volunteerCount').innerText = `Showing ${filtered.length} of ${rawVolunteers.length} volunteers`;
    renderTable(filtered);
  }

  function renderTable(records) {
    const tbody = document.getElementById("volunteerTableBody");

    if (records.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 20px; color: var(--text-dim);">No matching volunteers found.</td></tr>`;
      return;
    }

    tbody.innerHTML = records.map(row => {
      const fullName = row.fullName || row.Name || '—';
      const mobileNumber = row.mobileNumber || row.Mobile || row.Phone || '—';
      const gradeLevel = row.gradeLevel || row.GradeLevel || row.Grade || '—';
      const role = row.role || row.Role || '—';
      const scrambleEvents = row.scrambleEvents || row.ScrambleEvents || row.events || row.Events || '—';

      let formattedEvents = scrambleEvents;
      if (scrambleEvents !== '—' && scrambleEvents.toLowerCase() !== 'none' && scrambleEvents.toLowerCase() !== 'n/a') {
        formattedEvents = scrambleEvents.split(',')
          .map(e => `<span class="badge badge-event">${e.trim()}</span>`)
          .join(" ");
      }

      const phoneDisplay = (mobileNumber !== '—' && mobileNumber !== '')
        ? `<a href="tel:${mobileNumber}" class="phone-link">📞 ${mobileNumber}</a>` 
        : '—';

      return `
        <tr>
          <td><b>${fullName}</b></td>
          <td>${phoneDisplay}</td>
          <td>${gradeLevel}</td>
          <td><span class="badge badge-role">${role}</span></td>
          <td>${formattedEvents}</td>
        </tr>
      `;
    }).join("");
  }

  document.addEventListener("DOMContentLoaded", loadVolunteers);
</script>
</body>
</html>
