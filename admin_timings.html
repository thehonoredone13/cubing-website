<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Save Timings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12172B;
    --paper:#F6F4EF;
    --paper-dim:#EAE7DD;
    --cube-blue:#1758C4;
    --line:#D9D5C8;
    --text-dim:#6B7280;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;padding:30px 20px;}
  .wrap{max-width:500px;margin:0 auto;}
  header{margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:24px;}
  .back-link{color:var(--text-dim);text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .back-link:hover{color:var(--ink);}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;}
  .form-group{margin-bottom:14px;}
  .form-group label{display:block;font-size:12px;font-weight:600;font-family:'IBM Plex Mono',monospace;color:var(--text-dim);margin-bottom:4px;}
  .form-group input, .form-group select{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:'Inter',sans-serif;
  }

  /* Remove spin buttons / up & down arrows for time & station inputs */
  input[type=number]::-webkit-inner-spin-button, 
  input[type=number]::-webkit-outer-spin-button { 
    -webkit-appearance: none; 
    margin: 0; 
  }
  input[type=number] {
    -moz-appearance: textfield;
  }

  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .form-row-solves{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;transition:all 0.2s ease;}
  .form-row-solves.two-solves{grid-template-columns:repeat(2, 1fr);}
  
  .btn-submit{
    background:var(--cube-blue);color:#fff;width:100%;padding:12px;font-size:14px;
    border-radius:8px;border:none;font-weight:600;font-family:'IBM Plex Mono',monospace;cursor:pointer;
  }
  .btn-submit:hover{opacity:0.9;}
  .hint{font-size:11.5px;color:var(--text-dim);margin-top:6px;line-height:1.4;}
  .refresh-btn{
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--cube-blue);
    background:none;border:none;cursor:pointer;padding:0;
  }
  .refresh-btn:hover{text-decoration:underline;}
  .refresh-btn:disabled{opacity:0.5;cursor:not-allowed;text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Submit Solves &amp; Timing</h1>
    <a href="admin_home.html" class="back-link">&larr; Back to Home</a>
  </header>
  <div class="card">
    <form id="timingForm" onsubmit="submitTimings(event)">
      <!-- Station Number & Grade Row -->
      <div class="form-row">
        <div class="form-group">
          <label>Station Number (Max 10)</label>
          <input type="number" id="stationNum" placeholder="e.g. 1" min="1" max="10" oninput="enforceMaxStation(this)" required>
        </div>
        <div class="form-group">
          <label>Grade</label>
          <select id="gradeSelect" onchange="updateEventAvailability()" required>
            <optgroup label="Age Group: Grades 6–7">
              <option value="Grade 6">Grade 6</option>
              <option value="Grade 7">Grade 7</option>
            </optgroup>
            <optgroup label="Age Group: Grades 8–9">
              <option value="Grade 8">Grade 8</option>
              <option value="Grade 9">Grade 9</option>
            </optgroup>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Event</label>
        <select id="eventSelect" onchange="updateRoundOptions()">
          <option value="3x3">3x3</option>
          <option value="2x2">2x2</option>
          <option value="Pyraminx">Pyraminx</option>
          <option value="4x4">4x4</option>
          <option value="Megaminx">Megaminx</option>
        </select>
        <div class="hint">Megaminx and 4x4 are only open to Grades 8 &amp; 9. Format for 4x4 &amp; Megaminx is Best of 2.</div>
      </div>
      <div class="form-group">
        <label>Round</label>
        <select id="roundSelect" onchange="toggleStageField()">
          <!-- Dynamically populated -->
        </select>
      </div>
      <div class="form-group" id="stageGroup" style="display:none;">
        <label>Knockout Match</label>
        <select id="stageSelect">
          <!-- Dynamically populated for 2x2 / 3x3 Final -->
        </select>
        <div class="hint" id="stageHint">Submit once per competitor — enter both players' solves separately for the same match.</div>
      </div>
      <div class="form-group">
        <label style="display:flex;justify-content:space-between;align-items:center;">
          <span>Competitor</span>
          <button type="button" id="refreshCompBtn" class="refresh-btn" onclick="fetchRegisteredCompetitors()">&#8635; Refresh</button>
        </label>
        <select id="competitorSelect" required>
          <option value="">Loading competitors…</option>
        </select>
        <div class="hint" id="competitorHint">Only paid competitors registered for the selected grade &amp; event show up here.</div>
      </div>
      <div class="form-group">
        <label id="solvesLabel">Solves (in seconds, e.g. 14.52)</label>
        <div class="form-row-solves" id="solvesContainer">
          <input type="number" step="0.01" id="s1" placeholder="Solve 1">
          <input type="number" step="0.01" id="s2" placeholder="Solve 2">
          <input type="number" step="0.01" id="s3" placeholder="Solve 3">
        </div>
      </div>
      <div class="form-group">
        <label>Round Status</label>
        <select id="statusSelect">
          <option value="Complete">Complete (Finished)</option>
          <option value="Live">Live (Ongoing)</option>
          <option value="Upcoming">Upcoming</option>
        </select>
      </div>
      <button type="submit" class="btn-submit" id="saveBtn">Save Timings</button>
    </form>
  </div>
</div>
<script>
  const RESULTS_API_URL = "https://script.google.com/macros/s/AKfycbwRzpzNMKGX-Cd9Xoosy8WNbwj6NiVGAzoD6AJgCH-dSb39CQvDBbthAO10rzO7Hllq/exec";
  const REGISTRATION_API_URL = "https://script.google.com/macros/s/AKfycbyBZ_xge06xvF4sdKAndQKwtQlAhZjvHjl4HgF_1iGvCYzXD4uruJpk01D95D-ASHW7/exec";
  
  const EVENT_ROUNDS = {
    "3x3": ["First Round", "Second Round", "Final"],
    "2x2": ["First Round", "Second Round", "Final"],
    "Pyraminx": ["First Round", "Final"],
    "4x4": ["Final"],
    "Megaminx": ["Final"]
  };

  const KNOCKOUT_EVENTS = ["3x3", "2x2"];
  const KNOCKOUT_ROUND_NAME = "Final";
  const KNOCKOUT_STAGES_8_9 = [
    "Quarterfinal 1", "Quarterfinal 2", "Quarterfinal 3", "Quarterfinal 4",
    "Semifinal 1", "Semifinal 2",
    "Championship",
    "3rd Place Match"
  ];
  const KNOCKOUT_STAGES_6_7 = [
    "Semifinal 1", "Semifinal 2",
    "Championship",
    "3rd Place Match"
  ];

  function enforceMaxStation(input) {
    if (parseInt(input.value) > 10) {
      input.value = 10;
    }
  }

  function ageGroupForGrade(grade) {
    return (grade === "Grade 6" || grade === "Grade 7") ? "6-7" : "8-9";
  }

  let allRegisteredCompetitors = [];

  function normalizeRegistration(c) {
    return {
      compId: c.compId || c.id || c.ID || c.CompetitorID || "—",
      name: c.name || c.fullName || c.Name || "—",
      grade: c.ageGroup || c.grade || c.gradeLevel || c.Grade || "",
      events: String(c.events || c.scrambleEvents || c.Events || c.Event || c.SelectedEvents || ""),
      paymentStatus: String(c.PaymentStatus || c.paymentStatus || c.FeeStatus || c.feeStatus || "Pending")
    };
  }

  function hasEvent(c, key) {
    return c.events.split(",").map(e => e.trim().toLowerCase()).includes(key.toLowerCase());
  }

  function gradeDigit(g) {
    const m = String(g).match(/\d+/);
    return m ? m[0] : null;
  }

  function fetchRegisteredCompetitors() {
    const refreshBtn = document.getElementById("refreshCompBtn");
    if (refreshBtn) {
      refreshBtn.disabled = true;
      refreshBtn.innerText = "Refreshing…";
    }
    fetch(`${REGISTRATION_API_URL}?action=registrations`)
      .then(res => res.json())
      .then(data => {
        const rows = Array.isArray(data) ? data : (data.data || []);
        allRegisteredCompetitors = rows.map(normalizeRegistration);
        populateCompetitorDropdown();
      })
      .catch(err => {
        console.error("Error loading registered competitors:", err);
        document.getElementById("competitorSelect").innerHTML =
          `<option value="">Failed to load competitor list</option>`;
      })
      .finally(() => {
        if (refreshBtn) {
          refreshBtn.disabled = false;
          refreshBtn.innerText = "↻ Refresh";
        }
      });
  }

  function populateCompetitorDropdown() {
    const sel = document.getElementById("competitorSelect");
    const grade = document.getElementById("gradeSelect").value;
    const eventSel = document.getElementById("eventSelect").value;
    const gradeDig = gradeDigit(grade);

    if (allRegisteredCompetitors.length === 0) {
      sel.innerHTML = `<option value="">Loading competitors…</option>`;
      return;
    }

    const eligible = allRegisteredCompetitors
      .filter(c => ["paid", "yes", "true"].includes(c.paymentStatus.toLowerCase()))
      .filter(c => gradeDigit(c.grade) === gradeDig)
      .filter(c => hasEvent(c, eventSel))
      .sort((a, b) => a.name.localeCompare(b.name));

    if (eligible.length === 0) {
      sel.innerHTML = `<option value="">No paid ${grade} competitors registered for ${eventSel}</option>`;
      return;
    }

    sel.innerHTML = `<option value="" disabled selected>Select competitor…</option>` +
      eligible.map(c => `<option value="${c.compId}" data-name="${c.name}">${c.name} (${c.compId})</option>`).join("");
  }

  function updateEventAvailability() {
    const grade = document.getElementById("gradeSelect").value;
    const restricted = (grade === "Grade 6" || grade === "Grade 7");
    const eventSel = document.getElementById("eventSelect");
    Array.from(eventSel.options).forEach(opt => {
      opt.disabled = restricted && (opt.value === "4x4" || opt.value === "Megaminx");
    });
    if (restricted && (eventSel.value === "4x4" || eventSel.value === "Megaminx")) {
      eventSel.value = "3x3";
    }
    updateRoundOptions();
  }

  function updateRoundOptions() {
    const eventSel = document.getElementById("eventSelect").value;
    const roundSel = document.getElementById("roundSelect");
    const rounds = EVENT_ROUNDS[eventSel] || ["Final"];
    roundSel.innerHTML = rounds.map(r => `<option value="${r}">${r}</option>`).join("");

    // Toggle 2 solves vs 3 solves interface
    const solvesContainer = document.getElementById("solvesContainer");
    const s3Input = document.getElementById("s3");
    const solvesLabel = document.getElementById("solvesLabel");

    if (eventSel === "4x4" || eventSel === "Megaminx") {
      solvesContainer.classList.add("two-solves");
      s3Input.style.display = "none";
      s3Input.value = "";
      solvesLabel.innerText = "Solves (Best of 2 — in seconds, e.g. 14.52)";
    } else {
      solvesContainer.classList.remove("two-solves");
      s3Input.style.display = "block";
      solvesLabel.innerText = "Solves (Best of 3 — in seconds, e.g. 14.52)";
    }

    toggleStageField();
    populateCompetitorDropdown();
  }

  function toggleStageField() {
    const eventSel = document.getElementById("eventSelect").value;
    const roundSel = document.getElementById("roundSelect").value;
    const gradeSel = document.getElementById("gradeSelect").value;
    const stageGroup = document.getElementById("stageGroup");
    const stageSelect = document.getElementById("stageSelect");
    const stageHint = document.getElementById("stageHint");
    const isKnockout = KNOCKOUT_EVENTS.includes(eventSel) && roundSel === KNOCKOUT_ROUND_NAME;
    if (isKnockout) {
      const ageGroup = ageGroupForGrade(gradeSel);
      const stages = ageGroup === "6-7" ? KNOCKOUT_STAGES_6_7 : KNOCKOUT_STAGES_8_9;
      stageGroup.style.display = "block";
      stageSelect.innerHTML = stages.map(s => `<option value="${s}">${s}</option>`).join("");
      stageHint.innerText = ageGroup === "6-7"
        ? "Grades 6–7 run a 4-competitor bracket (Semifinals → Championship)."
        : "Grades 8–9 run the full 8-competitor bracket (Quarterfinals → Championship).";
    } else {
      stageGroup.style.display = "none";
      stageSelect.innerHTML = "";
    }
  }

  function submitTimings(e) {
    e.preventDefault();
    const competitorSelect = document.getElementById("competitorSelect");
    const compId = competitorSelect.value;
    if (!compId) {
      alert("Select a competitor first.");
      return;
    }
    const compName = competitorSelect.selectedOptions[0].dataset.name;

    const eventVal = document.getElementById("eventSelect").value;
    const isTwoSolves = (eventVal === "4x4" || eventVal === "Megaminx");

    const btn = document.getElementById("saveBtn");
    btn.disabled = true;
    btn.innerText = "Saving...";

    const s1 = parseFloat(document.getElementById("s1").value) || 0;
    const s2 = parseFloat(document.getElementById("s2").value) || 0;
    const s3 = isTwoSolves ? 0 : (parseFloat(document.getElementById("s3").value) || 0);

    const solves = isTwoSolves ? [s1, s2].filter(s => s > 0) : [s1, s2, s3].filter(s => s > 0);
    
    // Rank strictly by Best single solve time
    const best = solves.length > 0 ? Math.min(...solves).toFixed(2) : "-";
    const avg = solves.length > 0 ? (solves.reduce((a, b) => a + b, 0) / solves.length).toFixed(2) : "-";

    const roundVal = document.getElementById("roundSelect").value;
    const stageVisible = document.getElementById("stageGroup").style.display !== "none";
    const stageVal = document.getElementById("stageSelect").value;
    const ageGroup = ageGroupForGrade(document.getElementById("gradeSelect").value);
    const roundToSend = stageVisible && stageVal ? `${roundVal} — ${ageGroup} — ${stageVal}` : roundVal;

    const payload = {
      action: "submitResult",
      Station: document.getElementById("stationNum").value,
      Event: eventVal,
      Round: roundToSend,
      Rank: "",
      CompetitorID: compId,
      Name: compName,
      Grade: document.getElementById("gradeSelect").value,
      Solve1: s1 ? s1.toFixed(2) : "-",
      Solve2: s2 ? s2.toFixed(2) : "-",
      Solve3: isTwoSolves ? "N/A" : (s3 ? s3.toFixed(2) : "-"),
      Average: avg,
      Best: best,
      Status: document.getElementById("statusSelect").value
    };

    fetch(RESULTS_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      btn.disabled = false;
      btn.innerText = "Save Timings";
      if (res.success || res.status === "success") {
        alert("Timing saved successfully!");
        document.getElementById("timingForm").reset();
        updateEventAvailability();
      } else {
        alert("Error saving timings: " + (res.error || res.message || "Unknown error"));
      }
    })
    .catch(err => {
      btn.disabled = false;
      btn.innerText = "Save Timings";
      console.error("Error submitting timing:", err);
      alert("Failed to submit timings to backend.");
    });
  }

  document.addEventListener("DOMContentLoaded", () => {
    updateEventAvailability();
    fetchRegisteredCompetitors();
  });
</script>
</body>
</html>
