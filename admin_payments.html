<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Mark as Paid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12172B;
    --paper:#F6F4EF;
    --paper-dim:#EAE7DD;
    --cube-red:#E6402A;
    --cube-green:#1E8E5A;
    --line:#D9D5C8;
    --text-dim:#6B7280;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;padding:30px 20px;}
  .wrap{max-width:1100px;margin:0 auto;}
  header{margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:26px;}
  .back-link{color:var(--text-dim);text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .back-link:hover{color:var(--ink);}

  /* SUMMARY STATS CARD */
  .summary-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .summary-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    margin-bottom: 12px;
    color: var(--ink);
  }
  .totals-row {
    display: flex;
    gap: 32px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .total-stat-box {
    display: flex;
    flex-direction: column;
  }
  .total-stat-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .total-stat-count {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    color: var(--ink);
  }
  .total-stat {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    color: var(--cube-green);
  }
  .total-stat-potential {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    color: var(--ink);
  }
  .event-stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }
  .event-stat-item {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .event-stat-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .event-stat-val {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
  }
  .event-stat-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--cube-green);
    margin-top: 2px;
  }

  /* FILTER BAR */
  .filter-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    align-items: end;
  }
  .filter-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .filter-group label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .filter-control {
    width: 100%;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    color: var(--ink);
    outline: none;
    transition: border-color .15s;
  }
  .filter-control:focus { border-color: var(--ink); }

  .actions-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;color:var(--text-dim);padding:10px;border-bottom:1px solid var(--line);background:var(--paper-dim);text-align:left;}
  td{padding:12px 10px;border-bottom:1px solid var(--line);}
  
  .badge{display:inline-block;padding:3px 8px;border-radius:999px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;}
  .badge-paid{background:rgba(30,142,90,0.15);color:var(--cube-green);}
  .badge-pending{background:rgba(230,64,42,0.15);color:var(--cube-red);}
  .badge-grade{background:rgba(18,23,43,0.08);color:var(--ink);}
  
  .amount-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    color: var(--ink);
  }

  .btn{
    padding:6px 12px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;transition:all .15s ease;
  }
  .btn:hover:not(:disabled){opacity:0.85;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-pay{background:var(--cube-green);color:#fff;}
  .btn-unpay{background:var(--text-dim);color:#fff;}
  .btn-done{background:var(--paper-dim);color:var(--text-dim);border:1px solid var(--line);}
  .btn-refresh{background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;}

  .toggle-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Registrations &amp; Payment Status</h1>
    </div>
    <a href="admin_home.html" class="back-link">&larr; Back to Home</a>
  </header>

  <!-- SUMMARY STATS CARD -->
  <div class="summary-card">
    <div class="summary-title">Registration &amp; Revenue Overview</div>
    <div class="totals-row">
      <div class="total-stat-box">
        <span class="total-stat-label">Total Registrations</span>
        <div class="total-stat-count" id="totalRegsCount">0</div>
      </div>
      <div class="total-stat-box">
        <span class="total-stat-label">Total Revenue Collected</span>
        <div class="total-stat" id="totalCollected">₹0</div>
      </div>
      <div class="total-stat-box">
        <span class="total-stat-label">Total Registration Potential</span>
        <div class="total-stat-potential" id="totalPotential">₹0</div>
      </div>
    </div>
    <div class="event-stats-grid" id="eventStatsGrid">
      <div style="color: var(--text-dim); font-size: 13px;">Calculating stats...</div>
    </div>
  </div>

  <!-- FILTERS & SEARCH -->
  <div class="filter-card">
    <div class="filter-group">
      <label for="eventFilter">Filter by Event</label>
      <select id="eventFilter" class="filter-control" onchange="applyFilterAndSort()">
        <option value="ALL">All Events</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="gradeFilter">Filter by Grade</label>
      <select id="gradeFilter" class="filter-control" onchange="applyFilterAndSort()">
        <option value="ALL">All Grades</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="statusFilter">Payment Status</label>
      <select id="statusFilter" class="filter-control" onchange="applyFilterAndSort()">
        <option value="ALL">All Statuses</option>
        <option value="Pending">Pending Only</option>
        <option value="Paid">Paid Only</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="sortBy">Sort By</label>
      <select id="sortBy" class="filter-control" onchange="applyFilterAndSort()">
        <option value="Status-pending">Pending First</option>
        <option value="Status-paid">Paid First</option>
        <option value="ID-asc">ID (Ascending)</option>
        <option value="Name-asc">Name (A-Z)</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="searchInput">Search Competitor</label>
      <input type="text" id="searchInput" class="filter-control" placeholder="Search name, ID, or grade..." oninput="applyFilterAndSort()">
    </div>
  </div>

  <div class="actions-bar">
    <button class="btn btn-refresh" onclick="loadRegistrations()">↻ Refresh Registrations</button>
    
    <label class="toggle-wrap">
      <input type="checkbox" id="allowRevert" onchange="applyFilterAndSort()">
      Enable Revert ("Mark Pending")
    </label>
  </div>
  
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Grade</th>
          <th>Selected Events</th>
          <th>Amount Due</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="regTableBody">
        <tr>
          <td colspan="7" style="text-align:center; padding: 20px; color: var(--text-dim);">Loading...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const REGISTRATION_API_URL = "https://script.google.com/macros/s/AKfycbzDnOlNpI72X25rFl4D2rywCfv97MtvXX_Yzch2Yq7-yV4bjzypxy4u8OJOpS63h2Ll/exec";

  let rawRegistrations = [];

  function getLocalPaymentStatuses() {
    try {
      return JSON.parse(localStorage.getItem("payment_statuses_cache") || "{}");
    } catch(e) {
      return {};
    }
  }

  function saveLocalPaymentStatus(id, status) {
    const localData = getLocalPaymentStatuses();
    localData[id] = status;
    localStorage.setItem("payment_statuses_cache", JSON.stringify(localData));
  }

  function saveFilterSessionState() {
    const filterState = {
      eventFilter: document.getElementById('eventFilter').value,
      gradeFilter: document.getElementById('gradeFilter').value,
      statusFilter: document.getElementById('statusFilter').value,
      sortBy: document.getElementById('sortBy').value,
      searchInput: document.getElementById('searchInput').value,
      allowRevert: document.getElementById('allowRevert').checked
    };
    sessionStorage.setItem("admin_filter_session", JSON.stringify(filterState));
  }

  function restoreFilterSessionState() {
    try {
      const savedState = JSON.parse(sessionStorage.getItem("admin_filter_session"));
      if (!savedState) return;

      if (savedState.statusFilter !== undefined) document.getElementById('statusFilter').value = savedState.statusFilter;
      if (savedState.sortBy !== undefined) document.getElementById('sortBy').value = savedState.sortBy;
      if (savedState.searchInput !== undefined) document.getElementById('searchInput').value = savedState.searchInput;
      if (savedState.allowRevert !== undefined) document.getElementById('allowRevert').checked = savedState.allowRevert;
      
      if (savedState.eventFilter !== undefined) {
        const eventSelect = document.getElementById('eventFilter');
        if (eventSelect.querySelector(`option[value="${savedState.eventFilter}"]`)) {
          eventSelect.value = savedState.eventFilter;
        }
      }

      if (savedState.gradeFilter !== undefined) {
        const gradeSelect = document.getElementById('gradeFilter');
        if (gradeSelect.querySelector(`option[value="${savedState.gradeFilter}"]`)) {
          gradeSelect.value = savedState.gradeFilter;
        }
      }
    } catch (e) {
      console.warn("Could not restore session memory:", e);
    }
  }

  // Expanded search across potential column name variations in Apps Script response
  function getRawSpreadsheetStatus(item) {
    const possibleKeys = [
      "Payment Status", "PaymentStatus", "FeeStatus", "Fee Status", 
      "Status", "status", "payment_status", "fee_status", "Paid"
    ];

    for (let key of possibleKeys) {
      if (item[key] !== undefined && item[key] !== null) {
        return String(item[key]).trim();
      }
    }
    return "";
  }

  function isStatusPaid(statusStr) {
    if (!statusStr) return false;
    const cleanStr = String(statusStr).trim().toLowerCase();
    return cleanStr === "paid" || cleanStr === "true" || cleanStr === "yes" || cleanStr === "done" || cleanStr === "1";
  }

  // Robust overlay that prevents stale local cache from hiding paid records
  function applyLocalOverrides(data) {
    const localData = getLocalPaymentStatuses();
    return data.map(item => {
      const id = getRecordId(item);
      const sheetStatusRaw = getRawSpreadsheetStatus(item);
      const isSheetPaid = isStatusPaid(sheetStatusRaw);

      if (isSheetPaid) {
        item.computedStatus = "Paid";
      } else if (localData[id]) {
        item.computedStatus = localData[id];
      } else {
        item.computedStatus = sheetStatusRaw || "Pending";
      }

      item["Payment Status"] = item.computedStatus;
      item.PaymentStatus = item.computedStatus;
      item.FeeStatus = item.computedStatus;
      item.Status = item.computedStatus;

      return item;
    });
  }

  const CURRENCY_SYMBOL = "₹";

  function getRecordId(row) {
    return String(row.Username || row.username || row.ID || row.id || row["Competitor ID"] || row["User ID"] || '—').trim();
  }

  function getRecordName(row) {
    return String(row.Name || row.name || row["Full Name"] || row["Competitor Name"] || '—').trim();
  }

  function getRecordGrade(row) {
    return String(row.Grade || row.grade || row.Class || row.class || row["Grade/Class"] || '—').trim();
  }

  function getRecordEvents(row) {
    return String(row.Events || row.events || row["Selected Events"] || row["SelectedEvents"] || row.Event || '—').trim();
  }

  function calculateFeeFromEvents(eventsStr) {
    if (!eventsStr || eventsStr === '—') return 0;
    const count = eventsStr.split(',').map(e => e.trim()).filter(e => e.length > 0).length;

    if (count === 1) return 100;
    if (count === 2) return 200;
    if (count === 3) return 250;
    if (count === 4) return 300;
    if (count >= 5) return 350;

    return 0;
  }

  function getNumericAmount(row) {
    const eventsStr = getRecordEvents(row);
    const computedFee = calculateFeeFromEvents(eventsStr);

    if (computedFee > 0) {
      return computedFee;
    }

    const explicitAmount = row.Amount || row.amount || row.Fee || row.fee || row["Total Fee"] || row["Total Amount"] || row["Amount Due"] || row.AmountDue;
    if (explicitAmount !== undefined && explicitAmount !== null && explicitAmount !== '') {
      const parsed = parseFloat(String(explicitAmount).replace(/[^0-9.]/g, ''));
      if (!isNaN(parsed)) return parsed;
    }

    return 0;
  }

  function calculateAmount(row) {
    const total = getNumericAmount(row);
    return `${CURRENCY_SYMBOL}${total}`;
  }

  function calculateCollections(data) {
    let totalCollected = 0;
    let totalPotential = 0;
    const eventPaidCounts = {};
    const eventCounts = {};

    data.forEach(row => {
      const status = String(row.computedStatus || row["Payment Status"] || "Pending").trim();
      const isPaid = isStatusPaid(status);
      const amount = getNumericAmount(row);
      const eventsStr = getRecordEvents(row);

      totalPotential += amount;
      if (isPaid) totalCollected += amount;

      if (eventsStr !== '—') {
        const eventsList = eventsStr.split(',').map(e => e.trim()).filter(e => e.length > 0);
        
        eventsList.forEach(evt => {
          eventCounts[evt] = (eventCounts[evt] || 0) + 1;
          if (isPaid) {
            eventPaidCounts[evt] = (eventPaidCounts[evt] || 0) + 1;
          }
        });
      }
    });

    document.getElementById("totalRegsCount").innerText = data.length.toLocaleString();
    document.getElementById("totalCollected").innerText = `${CURRENCY_SYMBOL}${totalCollected.toLocaleString()}`;
    document.getElementById("totalPotential").innerText = `${CURRENCY_SYMBOL}${totalPotential.toLocaleString()}`;

    const grid = document.getElementById("eventStatsGrid");
    const allEvents = Array.from(new Set([...Object.keys(eventCounts)]));

    if (allEvents.length === 0) {
      grid.innerHTML = `<div style="color: var(--text-dim); font-size: 13px; grid-column: 1/-1;">No registrations found.</div>`;
      return;
    }

    grid.innerHTML = allEvents.map(evt => {
      const totalRegs = eventCounts[evt] || 0;
      const paidRegs = eventPaidCounts[evt] || 0;
      return `
        <div class="event-stat-item">
          <div class="event-stat-name">${evt}</div>
          <div class="event-stat-val">${totalRegs} Total Regs</div>
          <div class="event-stat-sub">${paidRegs} Paid Registration${paidRegs === 1 ? '' : 's'}</div>
        </div>
      `;
    }).join("");
  }

  function loadRegistrations() {
    const tbody = document.getElementById("regTableBody");
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding: 20px; color: var(--text-dim);">Loading...</td></tr>`;

    fetch(`${REGISTRATION_API_URL}?action=registrations`)
      .then(res => res.json())
      .then(data => {
        let fetchedData = Array.isArray(data) ? data : (data.data || []);
        rawRegistrations = applyLocalOverrides(fetchedData);
        if (rawRegistrations.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding: 20px; color: var(--text-dim);">No registrations found.</td></tr>`;
          return;
        }

        populateFilterDropdowns(rawRegistrations);
        restoreFilterSessionState();
        calculateCollections(rawRegistrations);
        applyFilterAndSort();
      })
      .catch(err => {
        console.error("Error loading registrations:", err);
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color: var(--cube-red); padding: 20px;">Failed to load data. Verify API_URL.</td></tr>`;
      });
  }

  function populateFilterDropdowns(data) {
    const eventSelect = document.getElementById('eventFilter');
    const selectedEvent = eventSelect.value;
    const uniqueEvents = new Set();

    const gradeSelect = document.getElementById('gradeFilter');
    const selectedGrade = gradeSelect.value;
    const uniqueGrades = new Set();

    data.forEach(item => {
      const eventStr = getRecordEvents(item);
      if (eventStr !== '—') {
        eventStr.split(',').forEach(e => uniqueEvents.add(e.trim()));
      }

      const gradeStr = getRecordGrade(item);
      if (gradeStr && gradeStr !== '—') {
        uniqueGrades.add(gradeStr);
      }
    });

    eventSelect.innerHTML = '<option value="ALL">All Events</option>';
    uniqueEvents.forEach(evt => {
      eventSelect.innerHTML += `<option value="${evt}">${evt}</option>`;
    });
    if ([...uniqueEvents].includes(selectedEvent)) {
      eventSelect.value = selectedEvent;
    }

    gradeSelect.innerHTML = '<option value="ALL">All Grades</option>';
    Array.from(uniqueGrades).sort((a, b) => a.localeCompare(b, undefined, {numeric: true})).forEach(grd => {
      gradeSelect.innerHTML += `<option value="${grd}">${grd}</option>`;
    });
    if ([...uniqueGrades].includes(selectedGrade)) {
      gradeSelect.value = selectedGrade;
    }
  }

  function applyFilterAndSort() {
    saveFilterSessionState();

    const eventFilter = document.getElementById('eventFilter').value;
    const gradeFilter = document.getElementById('gradeFilter').value;
    const statusFilter = document.getElementById('statusFilter').value;
    const sortBy = document.getElementById('sortBy').value;
    const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
    const allowRevert = document.getElementById('allowRevert').checked;

    let filtered = rawRegistrations.filter(row => {
      const status = String(row.computedStatus || row["Payment Status"] || "Pending").trim();
      const isPaid = isStatusPaid(status);
      const events = getRecordEvents(row);
      const grade = getRecordGrade(row);

      const matchEvent = (eventFilter === 'ALL') || (events !== '—' && events.toLowerCase().includes(eventFilter.toLowerCase()));
      const matchGrade = (gradeFilter === 'ALL') || (grade !== '—' && grade.toLowerCase() === gradeFilter.toLowerCase());

      let matchStatus = true;
      if (statusFilter === 'Pending') matchStatus = !isPaid;
      if (statusFilter === 'Paid') matchStatus = isPaid;

      const name = getRecordName(row).toLowerCase();
      const id = getRecordId(row).toLowerCase();
      const gradeText = grade.toLowerCase();
      const matchSearch = !searchQuery || name.includes(searchQuery) || id.includes(searchQuery) || gradeText.includes(searchQuery);

      return matchEvent && matchGrade && matchStatus && matchSearch;
    });

    filtered.sort((a, b) => {
      const isPaidA = isStatusPaid(a.computedStatus);
      const isPaidB = isStatusPaid(b.computedStatus);

      if (sortBy === 'Status-pending') {
        if (isPaidA === isPaidB) return 0;
        return !isPaidA ? -1 : 1;
      }
      if (sortBy === 'Status-paid') {
        if (isPaidA === isPaidB) return 0;
        return isPaidA ? -1 : 1;
      }
      if (sortBy === 'Name-asc') {
        return getRecordName(a).localeCompare(getRecordName(b));
      }
      if (sortBy === 'ID-asc') {
        return getRecordId(a).localeCompare(getRecordId(b), undefined, {numeric: true});
      }
      return 0;
    });

    renderTable(filtered, allowRevert);
  }

  function renderTable(records, allowRevert) {
    const tbody = document.getElementById("regTableBody");

    if (records.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding: 20px; color: var(--text-dim);">No matching registrations found.</td></tr>`;
      return;
    }

    tbody.innerHTML = records.map(row => {
      const recId = getRecordId(row);
      const recName = getRecordName(row);
      const recGrade = getRecordGrade(row);
      const recEvents = getRecordEvents(row);
      const amountFormatted = calculateAmount(row);

      const status = row.computedStatus || row["Payment Status"] || "Pending";
      const isPaid = isStatusPaid(status);
      const badgeClass = isPaid ? "badge-paid" : "badge-pending";
      const displayStatus = isPaid ? "Payment Done" : "Pending";

      let actionButton = '';

      if (!isPaid) {
        actionButton = `<button id="btn-${recId}" class="btn btn-pay" onclick="togglePayment('${recId}', 'Paid')">Mark Paid</button>`;
      } else {
        if (allowRevert) {
          actionButton = `<button id="btn-${recId}" class="btn btn-unpay" onclick="togglePayment('${recId}', 'Pending')">Mark Pending</button>`;
        } else {
          actionButton = `<button class="btn btn-done" disabled>Done / Paid</button>`;
        }
      }

      return `
        <tr>
          <td><b>${recId}</b></td>
          <td>${recName}</td>
          <td><span class="badge badge-grade">${recGrade}</span></td>
          <td>${recEvents}</td>
          <td><span class="amount-tag">${amountFormatted}</span></td>
          <td><span class="badge ${badgeClass}">${displayStatus}</span></td>
          <td>${actionButton}</td>
        </tr>
      `;
    }).join("");
  }

  function togglePayment(id, targetStatus) {
    if (!confirm(`Set payment status for ${id} to ${targetStatus}?`)) return;

    const btn = document.getElementById(`btn-${id}`);
    if (btn) {
      btn.disabled = true;
      btn.innerText = "Updating...";
    }

    saveLocalPaymentStatus(id, targetStatus);
    const item = rawRegistrations.find(r => getRecordId(r) === String(id));
    if (item) {
      item.computedStatus = targetStatus;
      item["Payment Status"] = targetStatus;
      item.PaymentStatus = targetStatus;
      item.FeeStatus = targetStatus;
      item.Status = targetStatus;
    }
    
    calculateCollections(rawRegistrations);
    applyFilterAndSort();

    fetch(REGISTRATION_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "updateRegistration",
        Username: id,
        id: id,
        PaymentStatus: targetStatus
      })
    })
    .then(res => res.json())
    .then(res => {
      if (!res.success && res.status !== "success") {
        console.warn("Backend dynamic sync warning:", res);
      }
    })
    .catch(err => {
      console.error("Backend connection note:", err);
    });
  }

  document.addEventListener("DOMContentLoaded", loadRegistrations);
</script>
</body>
</html>
