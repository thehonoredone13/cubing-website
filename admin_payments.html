<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Mark as Paid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12172B;
    --paper:#F6F4EF;
    --paper-dim:#EAE7DD;
    --cube-red:#E6402A;
    --cube-green:#1E8E5A;
    --line:#D9D5C8;
    --text-dim:#6B7280;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;padding:30px 20px;}
  .wrap{max-width:1050px;margin:0 auto;}
  header{margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:26px;}
  .back-link{color:var(--text-dim);text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .back-link:hover{color:var(--ink);}

  /* ---------- FILTER & CONTROLS BAR ---------- */
  .filter-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    align-items: end;
  }
  .filter-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .filter-group label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .filter-control {
    width: 100%;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    color: var(--ink);
    outline: none;
    transition: border-color .15s;
  }
  .filter-control:focus { border-color: var(--ink); }

  .actions-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;color:var(--text-dim);padding:10px;border-bottom:1px solid var(--line);background:var(--paper-dim);text-align:left;}
  td{padding:12px 10px;border-bottom:1px solid var(--line);}
  
  .badge{display:inline-block;padding:3px 8px;border-radius:999px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;}
  .badge-paid{background:rgba(30,142,90,0.15);color:var(--cube-green);}
  .badge-pending{background:rgba(230,64,42,0.15);color:var(--cube-red);}
  
  .btn{
    padding:6px 12px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;transition:all .15s ease;
  }
  .btn:hover:not(:disabled){opacity:0.85;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-pay{background:var(--cube-green);color:#fff;}
  .btn-unpay{background:var(--text-dim);color:#fff;}
  .btn-done{background:var(--paper-dim);color:var(--text-dim);border:1px solid var(--line);}
  .btn-refresh{background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;}

  .toggle-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Registrations &amp; Payment Status</h1>
    </div>
    <a href="admin_home.html" class="back-link">&larr; Back to Home</a>
  </header>

  <!-- FILTERS & SEARCH -->
  <div class="filter-card">
    <div class="filter-group">
      <label for="eventFilter">Filter by Cube Event</label>
      <select id="eventFilter" class="filter-control" onchange="applyFilterAndSort()">
        <option value="ALL">All Events</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="statusFilter">Payment Status</label>
      <select id="statusFilter" class="filter-control" onchange="applyFilterAndSort()">
        <option value="ALL">All Statuses</option>
        <option value="Pending">Pending Only</option>
        <option value="Paid">Paid Only</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="sortBy">Sort By</label>
      <select id="sortBy" class="filter-control" onchange="applyFilterAndSort()">
        <option value="Status-pending">Pending First</option>
        <option value="Status-paid">Paid First</option>
        <option value="ID-asc">ID (Ascending)</option>
        <option value="Name-asc">Name (A-Z)</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="searchInput">Search Competitor</label>
      <input type="text" id="searchInput" class="filter-control" placeholder="Search name or ID..." oninput="applyFilterAndSort()">
    </div>
  </div>

  <div class="actions-bar">
    <button class="btn btn-refresh" onclick="loadRegistrations()">↻ Refresh Registrations</button>
    
    <label class="toggle-wrap">
      <input type="checkbox" id="allowRevert" onchange="applyFilterAndSort()">
      Enable Revert ("Mark Pending")
    </label>
  </div>
  
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Selected Events</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="regTableBody">
        <tr>
          <td colspan="5" style="text-align:center; padding: 20px; color: var(--text-dim);">Loading...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // UPDATE THIS TO YOUR REGISTRATIONS APPS SCRIPT DEPLOYED URL
  const REGISTRATION_API_URL = "https://script.google.com/macros/s/AKfycbzDnOlNpI72X25rFl4D2rywCfv97MtvXX_Yzch2Yq7-yV4bjzypxy4u8OJOpS63h2Ll/exec";

  let rawRegistrations = [];

  function loadRegistrations() {
    const tbody = document.getElementById("regTableBody");
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 20px; color: var(--text-dim);">Loading...</td></tr>`;

    fetch(`${REGISTRATION_API_URL}?action=registrations`)
      .then(res => res.json())
      .then(data => {
        rawRegistrations = Array.isArray(data) ? data : (data.data || []);
        if (rawRegistrations.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 20px; color: var(--text-dim);">No registrations found.</td></tr>`;
          return;
        }

        populateEventDropdown(rawRegistrations);
        applyFilterAndSort();
      })
      .catch(err => {
        console.error("Error loading registrations:", err);
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--cube-red); padding: 20px;">Failed to load data. Verify API_URL.</td></tr>`;
      });
  }

  // Populate dynamic Cube Event options
  function populateEventDropdown(data) {
    const eventSelect = document.getElementById('eventFilter');
    const selected = eventSelect.value;

    const uniqueEvents = new Set();

    data.forEach(item => {
      const eventStr = item.Events || item.Event || item.SelectedEvents || '';
      if (eventStr) {
        // Split if comma separated (e.g. "3x3, 2x2, Pyraminx")
        eventStr.split(',').forEach(e => uniqueEvents.add(e.trim()));
      }
    });

    eventSelect.innerHTML = '<option value="ALL">All Events</option>';
    uniqueEvents.forEach(evt => {
      eventSelect.innerHTML += `<option value="${evt}">${evt}</option>`;
    });

    if ([...uniqueEvents].includes(selected)) {
      eventSelect.value = selected;
    }
  }

  function applyFilterAndSort() {
    const eventFilter = document.getElementById('eventFilter').value;
    const statusFilter = document.getElementById('statusFilter').value;
    const sortBy = document.getElementById('sortBy').value;
    const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
    const allowRevert = document.getElementById('allowRevert').checked;

    // 1. FILTERING
    let filtered = rawRegistrations.filter(row => {
      const status = (row.PaymentStatus || row.FeeStatus || "Pending").trim();
      const isPaid = status.toLowerCase() === "paid";
      const events = row.Events || row.Event || row.SelectedEvents || '';

      // Event Match
      const matchEvent = (eventFilter === 'ALL') || events.toLowerCase().includes(eventFilter.toLowerCase());

      // Status Match
      let matchStatus = true;
      if (statusFilter === 'Pending') matchStatus = !isPaid;
      if (statusFilter === 'Paid') matchStatus = isPaid;

      // Search Query Match
      const name = (row.Name || '').toLowerCase();
      const id = String(row.ID || '').toLowerCase();
      const matchSearch = !searchQuery || name.includes(searchQuery) || id.includes(searchQuery);

      return matchEvent && matchStatus && matchSearch;
    });

    // 2. SORTING
    filtered.sort((a, b) => {
      const statusA = (a.PaymentStatus || a.FeeStatus || "Pending").toLowerCase();
      const statusB = (b.PaymentStatus || b.FeeStatus || "Pending").toLowerCase();

      if (sortBy === 'Status-pending') {
        if (statusA === statusB) return 0;
        return statusA === 'pending' ? -1 : 1;
      }
      if (sortBy === 'Status-paid') {
        if (statusA === statusB) return 0;
        return statusA === 'paid' ? -1 : 1;
      }
      if (sortBy === 'Name-asc') {
        return (a.Name || '').localeCompare(b.Name || '');
      }
      if (sortBy === 'ID-asc') {
        return String(a.ID || '').localeCompare(String(b.ID || ''), undefined, {numeric: true});
      }
      return 0;
    });

    // 3. RENDER TABLE
    renderTable(filtered, allowRevert);
  }

  function renderTable(records, allowRevert) {
    const tbody = document.getElementById("regTableBody");

    if (records.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 20px; color: var(--text-dim);">No matching registrations found.</td></tr>`;
      return;
    }

    tbody.innerHTML = records.map(row => {
      const status = row.PaymentStatus || row.FeeStatus || "Pending";
      const isPaid = String(status).toLowerCase() === "paid";
      const badgeClass = isPaid ? "badge-paid" : "badge-pending";
      const displayStatus = isPaid ? "Payment Done" : "Pending";

      let actionButton = '';

      if (!isPaid) {
        // Pending state -> Show "Mark Paid" button
        actionButton = `<button id="btn-${row.ID}" class="btn btn-pay" onclick="togglePayment('${row.ID}', 'Paid')">Mark Paid</button>`;
      } else {
        // Paid state -> Disabled "Done" button (or "Mark Pending" if revert option is enabled)
        if (allowRevert) {
          actionButton = `<button id="btn-${row.ID}" class="btn btn-unpay" onclick="togglePayment('${row.ID}', 'Pending')">Mark Pending</button>`;
        } else {
          actionButton = `<button class="btn btn-done" disabled>Done / Paid</button>`;
        }
      }

      return `
        <tr>
          <td><b>${row.ID || '—'}</b></td>
          <td>${row.Name || '—'}</td>
          <td>${row.Events || row.Event || '—'}</td>
          <td><span class="badge ${badgeClass}">${displayStatus}</span></td>
          <td>${actionButton}</td>
        </tr>
      `;
    }).join("");
  }

  function togglePayment(id, targetStatus) {
    if (!confirm(`Set payment status for ${id} to ${targetStatus}?`)) return;

    const btn = document.getElementById(`btn-${id}`);
    if (btn) {
      btn.disabled = true;
      btn.innerText = "Updating...";
    }

    fetch(REGISTRATION_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "updateRegistration",
        id: id,
        PaymentStatus: targetStatus
      })
    })
    .then(res => res.json())
    .then(res => {
      if (res.success || res.status === "success") {
        // Update local state instantly and re-render
        const item = rawRegistrations.find(r => String(r.ID) === String(id));
        if (item) {
          item.PaymentStatus = targetStatus;
          item.FeeStatus = targetStatus;
        }
        applyFilterAndSort();
      } else {
        alert("Error: " + (res.error || res.message || "Failed to update payment status"));
        if (btn) {
          btn.disabled = false;
          btn.innerText = targetStatus === 'Paid' ? "Mark Paid" : "Mark Pending";
        }
      }
    })
    .catch(err => {
      console.error("Error:", err);
      alert("Failed to connect to backend server.");
      if (btn) {
        btn.disabled = false;
        btn.innerText = targetStatus === 'Paid' ? "Mark Paid" : "Mark Pending";
      }
    });
  }

  document.addEventListener("DOMContentLoaded", loadRegistrations);
</script>
</body>
</html>
